name: Build and Release EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release RemoveBG.exe
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: tag
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG.Trim()

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "release_tag is required."
          }

          if ($tag -match '\s') {
            throw "release_tag must not contain whitespace."
          }

          if ($tag -match '[~^:?*\[\]\\]') {
            throw "release_tag contains characters that are not valid in a Git ref."
          }

          git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "release_tag is not a valid Git tag name."
          }

          "name=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        shell: pwsh
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        shell: pwsh
        run: uv sync

      - name: Build executable
        shell: pwsh
        run: uv run python build_app.py

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist\RemoveBG.exe"

          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Expected executable was not created: $exe"
          }

          $size = (Get-Item $exe).Length
          if ($size -le 0) {
            throw "Executable is empty: $exe"
          }

          Write-Host "Built $exe ($size bytes)."

      - name: Create tag if needed
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin --tags --force

          if (git rev-parse -q --verify "refs/tags/$tag") {
            Write-Host "Tag $tag already exists."
          } else {
            git tag $tag
            git push origin "refs/tags/$tag"
            Write-Host "Created and pushed tag $tag."
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          $asset = "dist\RemoveBG.exe"

          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title $tag --notes "Windows executable release for $tag."
          }
